name: procedimentos-administrativos

# Compose de VPS. Diferenças para o de desenvolvimento:
#  - consome imagens do Docker Hub em vez de buildar
#  - Caddy na frente, com HTTPS automático; nada mais escuta na internet
#  - Postgres e MinIO sem porta publicada (só a rede interna alcança)
#  - pg_dump diário com retenção
#
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

x-logging: &logging
  driver: json-file
  options:
    # Sem isto o log cresce até encher o disco da VPS.
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - web
      - api
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env.prod}
      EMAIL_ACME: ${EMAIL_ACME:?defina EMAIL_ACME no .env.prod}
    # Com Cloudflare Tunnel, BIND=127.0.0.1: o cloudflared alcança pelo
    # loopback e a VPS não precisa de porta nenhuma aberta na internet.
    ports:
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
      - "${CADDY_BIND:-0.0.0.0}:443:443/udp"
    volumes:
      # Caddyfile        = acesso direto, Caddy emite o certificado
      # Caddyfile.tunnel = atrás de Cloudflare Tunnel, HTTP puro na origem
      - ./docker/caddy/${CADDY_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-procedimentos}
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=icu
        --icu-locale=pt-BR
        --data-checksums
      TZ: ${TZ:-America/Sao_Paulo}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    # Sem `ports`: o banco só existe dentro da rede do compose.
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: ${POSTGRES_SHM:-512mb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-procedimentos}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY}
      TZ: ${TZ:-America/Sao_Paulo}
    # Console e API do MinIO ficam fora da internet. Para abrir o console,
    # use um túnel SSH: ssh -L 9001:localhost:9001 usuario@vps
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-procedimentos} &&
      echo 'Bucket ${MINIO_BUCKET:-procedimentos} pronto.'
      "
    logging: *logging

  api:
    image: ${IMAGE_REPO:-workcenterma/br-consultoria}:api-${IMAGE_TAG:?defina IMAGE_TAG no .env.prod}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-procedimentos}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PORT: 3333
      TZ: ${TZ:-America/Sao_Paulo}
      # Deixe true para o deploy aplicar as migrations sozinho. Se preferir
      # aplicar à mão antes de trocar a imagem, ponha false e rode:
      #   docker compose -f docker-compose.prod.yml run --rm api node dist/scripts/migrate.js
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador do sistema}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-procedimentos}
      MINIO_REGIAO: ${MINIO_REGIAO:-us-east-1}
      # A API cifra a senha do SMTP que a tela do administrativo geral grava, e
      # a decifra no envio de teste. Pôr a variável só no `.env.prod` não basta:
      # o Compose passa para dentro do contêiner **apenas** o que está aqui.
      EMAIL_CHAVE: ${EMAIL_CHAVE:?defina EMAIL_CHAVE no .env.prod (openssl rand -base64 32)}
      # Endereço público: entra nos links dos e-mails e no código de
      # conferência das peças emitidas. Vazio produz link quebrado, calado.
      APP_URL: ${APP_URL:?defina APP_URL no .env.prod (https://seu-dominio)}
    # Sem `ports`: quem fala com a API é o Caddy, pela rede interna.
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${API_MEM:-512M}

  # ---------------------------------------------------------------------------
  # O worker que esvazia a fila de e-mails.
  #
  # Mesma imagem da API, outro comando. Separado de propósito: pico de envio não
  # afeta quem está na tela, e reiniciar um não derruba o outro. Sem porta e sem
  # healthcheck HTTP — ele não atende ninguém, só lê a fila.
  #
  # `RUN_MIGRATIONS: "false"`: quem aplica migration é a API. Dois processos
  # correndo o migrator ao mesmo tempo é a corrida clássica de deploy.
  email-worker:
    image: ${IMAGE_REPO:-workcenterma/br-consultoria}:api-${IMAGE_TAG:?defina IMAGE_TAG no .env.prod}
    pull_policy: always
    command: ["node", "dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-procedimentos}
      TZ: ${TZ:-America/Sao_Paulo}
      RUN_MIGRATIONS: "false"
      # Sem ela o worker não sobe: não teria como decifrar senha de SMTP
      # nenhuma, e todo envio autenticado falharia cinco vezes antes de morrer.
      EMAIL_CHAVE: ${EMAIL_CHAVE:?defina EMAIL_CHAVE no .env.prod (openssl rand -base64 32)}
      APP_URL: ${APP_URL:?defina APP_URL no .env.prod (https://seu-dominio)}
      EMAIL_INTERVALO_MS: ${EMAIL_INTERVALO_MS:-15000}
      EMAIL_LOTE: ${EMAIL_LOTE:-20}
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${EMAIL_WORKER_MEM:-256M}

  web:
    image: ${IMAGE_REPO:-workcenterma/br-consultoria}:web-${IMAGE_TAG:?defina IMAGE_TAG no .env.prod}
    pull_policy: always
    depends_on:
      - api
    environment:
      API_URL: http://api:3333
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      # Precisa bater com o domínio público, senão o callback do login quebra.
      AUTH_URL: https://${DOMINIO}
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM:-512M}

  # pg_dump diário comprimido em ./backups, com retenção por dias.
  backup:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-procedimentos}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      HORA_BACKUP: ${BACKUP_HORA:-03}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./backups:/backups
      - ./docker/backup/rodar.sh:/rodar.sh:ro
    entrypoint: ["/bin/sh", "/rodar.sh"]
    restart: unless-stopped
    logging: *logging
