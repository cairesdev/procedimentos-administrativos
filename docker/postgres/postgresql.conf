# Configuração do Postgres 18 para o ambiente de teste em Docker.
# Aplicada via `-c config_file=`; o entrypoint da imagem continua cuidando do
# initdb e do pg_hba.conf.
#
# Números pensados para uma máquina de desenvolvimento (2–4 GB para o banco).
# Em produção, refaça a conta a partir da RAM real do servidor.

# ---- Caminhos -------------------------------------------------------------
# Quando o config_file mora fora do PGDATA, o Postgres passa a procurar
# pg_hba.conf e pg_ident.conf na pasta DO CONFIG — e não sobe, porque quem
# escreve esses dois é o entrypoint da imagem, dentro do PGDATA. Por isso os
# três caminhos vêm explícitos aqui.
# Precisam bater com o PGDATA do docker-compose.yml; ao subir para o PG19,
# troque o 18 nos dois lugares.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# ---- Conexões -------------------------------------------------------------
# Obrigatório no Docker: sem isto os outros containers não enxergam o banco.
listen_addresses = '*'
max_connections = 100

# ---- Memória --------------------------------------------------------------
# shared_buffers ~25% da RAM dedicada; effective_cache_size ~75%.
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# ---- Escrita --------------------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
# SSD: acesso aleatório custa quase o mesmo que sequencial.
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- Log ------------------------------------------------------------------
log_timezone = 'America/Sao_Paulo'
log_line_prefix = '%m [%p] %q%u@%d '
# Toda consulta acima de 1s vira linha de log — o suficiente para achar a
# query lenta sem afogar o console.
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ---- Sessão ---------------------------------------------------------------
timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'
lc_messages = 'C'
default_text_search_config = 'pg_catalog.portuguese'

# ---- Estatísticas ---------------------------------------------------------
track_io_timing = on
