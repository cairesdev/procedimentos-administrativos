name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_REPO: workcenterma/br-consultoria

jobs:
  verificar:
    name: Typecheck e lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projeto: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.projeto }}/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Lint
        if: matrix.projeto == 'web'
        run: npx eslint src

  publicar:
    name: Build e push (${{ matrix.projeto }})
    needs: verificar
    # PR só verifica; imagem sai apenas de main e de tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        projeto: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Um repositório só, um prefixo por serviço: api-* e web-*.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          flavor: |
            prefix=${{ matrix.projeto }}-,onlatest=true
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Versão exibida no rodapé
        id: versao
        run: echo "valor=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.projeto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.projeto }}
          cache-to: type=gha,mode=max,scope=${{ matrix.projeto }}
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ vars.APP_NAME }}
            NEXT_PUBLIC_APP_SHORT_NAME=${{ vars.APP_SHORT_NAME }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.versao.outputs.valor }}
